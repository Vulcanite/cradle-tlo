---
# domain_join -- join this host to {{ join_domain }} (charlie.local or
# oscar.local, passed in via role() vars). Mirrors secrets_db's existing
# "alpha.local domain join" section exactly (same two-step DNS + join
# pattern, already proven working in this collection for secrets.alpha).

- name: Point DNS at the {{ join_domain }} DC (so the domain resolves for join)
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers:
      - '{{ dc_ip }}'

- name: Join this host to {{ join_domain }}
  microsoft.ad.membership:
    dns_domain_name: '{{ join_domain }}'
    # NETBIOS\user, not a bare name -- unqualified, this resolves against
    # the joining host's own local accounts (which also has a "vagrant"
    # user) instead of the target domain, and fails with "Unable to update
    # the password. The value provided as the current password is
    # incorrect." (confirmed live). NetBIOS form used over UPN since the
    # account's UserPrincipalName attribute is unset (confirmed live) and
    # NetJoinDomain-style APIs are most reliable with the classic form.
    # join_domain's first label, uppercased, matches charlie_domain/
    # oscar_domain's own netbios name (CHARLIE/OSCAR) exactly.
    domain_admin_user: '{{ (join_domain.split(".")[0]) | upper }}\{{ domain_join_admin_user }}'
    domain_admin_password: '{{ domain_join_admin_password }}'
    state: domain
    reboot: true
