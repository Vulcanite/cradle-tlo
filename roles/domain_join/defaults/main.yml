---
# domain_join -- join a member server to the charlie.local or oscar.local
# domain promoted by charlie_domain/oscar_domain. Reusable across both
# domains: the target domain and its DC's IP are passed in per-instance via
# role() vars in TheLastOnes.cradle (join_domain, dc_ip), not hardcoded here,
# so the same role serves every CHARLIE and OSCAR member server.
#
# join_domain and dc_ip are required and have no default -- if a role()
# call forgets to pass them, this fails loudly at the DNS-client task rather
# than silently joining the wrong domain or no domain at all.

# Credential used to authenticate the domain join. NOT the domain's
# Administrator (RID 500) -- its real password is whatever the box image
# ships with and isn't actually known here. A domain-join only needs *some*
# valid domain credential (Windows lets any authenticated user join up to
# ms-DS-MachineAccountQuota computers, default 10, with no admin rights
# needed), and DCPromo carries the pre-existing local "vagrant" account
# through into the new domain as its own principal with its own unchanged
# password -- confirmed live on charlie.local (`vagrant` exists as a domain
# user, password still "vagrant", same account this range's whole Ansible
# inventory already authenticates with pre-promotion).
domain_join_admin_user: vagrant
domain_join_admin_password: 'vagrant'
