---
# attacker -- the AI pentesting agent's vantage point.
# This fleet's attacker instance is Ubuntu 22.04, NOT Kali (see the .cradle
# header: Kali mirrors proved unreliable from the deployment host), so the
# pentest toolchain the smoke_m*.sh chains depend on is installed here
# instead of assumed from a Kali base image. Ubuntu's john package is the
# jumbo build (ships keepass2john).

- name: Acknowledge attacker instance
  ansible.builtin.debug:
    msg: "This instance is the AI pentesting agent's attacker vantage point."

# ---- Smoke-chain toolchain ----------------------------------------------
- name: Install the apt part of the smoke-chain toolchain
  become: true
  ansible.builtin.apt:
    name:
      - john
      - hashcat
      - proxychains4
      - unzip
    state: present
    update_cache: true

- name: Install the pip part of the smoke-chain toolchain
  become: true
  ansible.builtin.pip:
    name:
      - mythic
      - pyyaml
      - cryptography
    state: present

# latest (not present): an older apt/pip impacket already satisfies
# "present" but lacks the entry points the smoke chains call
# (impacket-secretsdump/-dpapi/-getTGT/-getST/-mssqlclient).
- name: Upgrade impacket to the full example set
  become: true
  ansible.builtin.pip:
    name: impacket
    state: latest

# A plain version-satisfied install has been observed to materialize only
# some of the example entry points (smbclient/psexec but not secretsdump
# et al.); force a clean reinstall until the entry points actually exist.
- name: Ensure the impacket example entry points exist
  become: true
  ansible.builtin.shell: pip3 install --force-reinstall --no-deps impacket
  args:
    creates: /usr/local/bin/impacket-secretsdump

- name: Install the jumbo-john build dependencies
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - libssl-dev
      - zlib1g-dev
    state: present

# Ubuntu's john package is the CORE build (no keepass2john -- that's
# jumbo-only, Kali ships jumbo). The kdbx-cracking step (m4.s4) needs
# keepass2john specifically, so build it once from the jumbo source and
# drop the single binary into /usr/local/bin.
- name: Build keepass2john from JohnTheRipper jumbo
  become: true
  ansible.builtin.shell: |
    set -e
    rm -rf /opt/jtr-jumbo
    git clone --depth 1 https://github.com/openwall/john /opt/jtr-jumbo
    cd /opt/jtr-jumbo/src
    ./configure >/dev/null 2>&1
    make -j2 >/dev/null 2>&1
    cp ../run/keepass2john /usr/local/bin/keepass2john
    rm -rf /opt/jtr-jumbo
  args:
    creates: /usr/local/bin/keepass2john

- name: Ensure the wordlists directory exists
  become: true
  ansible.builtin.file:
    path: /usr/share/wordlists
    state: directory
    mode: "0755"

# The canonical rockyou wordlist the cracking steps (m3 hashcat, m4
# keepass2john+john) run against. 134 MB one-time download.
- name: Download rockyou.txt
  become: true
  ansible.builtin.get_url:
    url: https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt
    dest: /usr/share/wordlists/rockyou.txt
    mode: "0644"

# Stage the flags manifest the smoke_m*.sh scripts cross-check against.
# The scripts resolve it from /tmp/manifest.yaml first, then
# <script-dir>/../flags/manifest.yaml -- cover both. The manifest comes
# from the controller side (scripts/generate_flags.py output), NEVER from
# inside this (public) collection repo -- publishing flags would hand every
# evaluated agent the answers. Skipped cleanly when no manifest is staged
# so the role stays a no-op for manifest-less deployments.
- name: Stage the flags manifest for the smoke-chain scripts
  when: tlo_flags_manifest is defined and tlo_flags_manifest | length > 0
  block:
    - name: Stat the controller-side flags manifest
      ansible.builtin.stat:
        path: '{{ tlo_flags_manifest }}'
      delegate_to: localhost
      become: false
      register: tlo_flags_manifest_stat

    - name: Fail loudly if the configured manifest is missing
      ansible.builtin.assert:
        that: tlo_flags_manifest_stat.stat.exists
        fail_msg: >-
          tlo_flags_manifest points at {{ tlo_flags_manifest }} but the file
          does not exist on the controller. Run scripts/generate_flags.py.

    - name: Ensure the flags directory exists
      ansible.builtin.file:
        path: /home/vagrant/flags
        state: directory
        mode: "0700"

    - name: Copy the manifest where the smoke scripts look for it
      ansible.builtin.copy:
        src: '{{ tlo_flags_manifest }}'
        dest: '{{ item }}'
        mode: "0600"
      loop:
        - /tmp/manifest.yaml
        - /home/vagrant/flags/manifest.yaml
