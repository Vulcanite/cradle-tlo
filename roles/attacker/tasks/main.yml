---
# attacker -- the AI pentesting agent's vantage point.
# Kali Linux (rolling). Kali's own apt mirrors (http.kali.org and friends)
# are unreachable from this deployment host -- confirmed twice now (fast
# TCP resets, not timeouts: a campus network security policy on the
# deployment host's network, not a dead mirror). An earlier iteration of
# this fleet worked around this by substituting Ubuntu for Kali entirely;
# this one keeps the real Kali box (for its native impacket-scripts/
# jumbo-john packaging) and instead repoints Kali's apt source at Debian's
# own mirror below, since none of the packages this role needs are actually
# Kali-specific -- kali-rolling tracks Debian testing/unstable.

- name: Acknowledge attacker instance
  ansible.builtin.debug:
    msg: "This instance is the AI pentesting agent's attacker vantage point."

# Guarded on the file's existence so this role stays a no-op on a non-Kali
# attacker image (e.g. if a future iteration substitutes Ubuntu again).
- name: Check whether this is a Kali box with its own (blocked) apt source
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/kali.sources
  register: kali_sources_file

- name: Point Kali's apt source at a reachable Debian mirror instead
  when: kali_sources_file.stat.exists
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kali.sources
    content: |
      Types: deb
      URIs: http://deb.debian.org/debian/
      Suites: sid
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    mode: "0644"

# ---- Smoke-chain toolchain ----------------------------------------------
- name: Install the apt part of the smoke-chain toolchain
  become: true
  ansible.builtin.apt:
    name:
      - john
      - hashcat
      - proxychains4
      - unzip
      - jq
      # hashcat has no OpenCL/CUDA/HIP backend at all without this on a
      # plain KVM guest with no GPU passthrough -- confirmed live
      # (`clGetPlatformIDs(): CL_PLATFORM_NOT_FOUND_KHR`); --force alone
      # only skips the driver-warning check, it doesn't provide a backend.
      - pocl-opencl-icd
      - ocl-icd-libopencl1
    state: present
    update_cache: true

# Kali rolling ships Python 3.13, which enforces PEP 668
# (externally-managed-environment) -- pip refuses an unmanaged system
# install without this flag. None of these three are Kali-packaged
# (mythic isn't packaged at all; pyyaml/cryptography exist as
# python3-yaml/python3-cryptography but a mixed apt+pip install for the
# same libs is more fragile than just using pip consistently for all three).
- name: Install the pip part of the smoke-chain toolchain
  become: true
  ansible.builtin.pip:
    name:
      - mythic
      - pyyaml
      - cryptography
    state: present
    extra_args: --break-system-packages

# Real Kali's `impacket-scripts` + `python3-impacket` (apt, already on the
# base image) provide every impacket-<name> entry point the smoke chains
# call, and Kali's `john` is already the jumbo build (ships keepass2john) --
# neither the pip force-reinstall nor the from-source jumbo build the
# previous Ubuntu-substitute iteration needed are required here. Forcing a
# pip impacket install on top of Kali's apt-managed one risks breaking the
# working system install instead, so this is deliberately left alone.

- name: Ensure the wordlists directory exists
  become: true
  ansible.builtin.file:
    path: /usr/share/wordlists
    state: directory
    mode: "0755"

# The canonical rockyou wordlist the cracking steps (m3 hashcat, m4
# keepass2john+john) run against. 134 MB one-time download.
- name: Download rockyou.txt
  become: true
  ansible.builtin.get_url:
    url: https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt
    dest: /usr/share/wordlists/rockyou.txt
    mode: "0644"

# Stage the flags manifest the smoke_m*.sh scripts cross-check against.
# The scripts resolve it from /tmp/manifest.yaml first, then
# <script-dir>/../flags/manifest.yaml -- cover both. The manifest comes
# from the controller side (scripts/generate_flags.py output), NEVER from
# inside this (public) collection repo -- publishing flags would hand every
# evaluated agent the answers. Skipped cleanly when no manifest is staged
# so the role stays a no-op for manifest-less deployments.
- name: Stage the flags manifest for the smoke-chain scripts
  when: tlo_flags_manifest is defined and tlo_flags_manifest | length > 0
  block:
    - name: Stat the controller-side flags manifest
      ansible.builtin.stat:
        path: '{{ tlo_flags_manifest }}'
      delegate_to: localhost
      become: false
      register: tlo_flags_manifest_stat

    - name: Fail loudly if the configured manifest is missing
      ansible.builtin.assert:
        that: tlo_flags_manifest_stat.stat.exists
        fail_msg: >-
          tlo_flags_manifest points at {{ tlo_flags_manifest }} but the file
          does not exist on the controller. Run scripts/generate_flags.py.

    - name: Ensure the flags directory exists
      ansible.builtin.file:
        path: /home/vagrant/flags
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0700"

    - name: Copy the manifest where the smoke scripts look for it
      ansible.builtin.copy:
        src: '{{ tlo_flags_manifest }}'
        dest: '{{ item }}'
        owner: vagrant
        group: vagrant
        mode: "0600"
      loop:
        - /tmp/manifest.yaml
        - /home/vagrant/flags/manifest.yaml
