---
# charlie_domain -- promote the charlie.local AD forest on dc1.charlie.
# Mirrors alpha_domain's pattern exactly. Not a GOAD fork: this range never
# builds AD CS or any GOAD-default noise users -- ad_cs_harden already skips
# cleanly when no CA is present, and every TLO-specific principal
# (morgana.lefey, helpdesk.admin, etc.) is created by its own role
# (asrep_bait_user, helpdesk_admin_user), not inherited from GOAD.

charlie_dns_domain: charlie.local
charlie_netbios: CHARLIE

# DSRM / safe-mode password for the DC promotion.
charlie_safe_mode_password: 'Dsrm-Charlie-2026!'

# Not referenced by this role's own tasks (microsoft.ad.domain's promotion
# call needs no domain-admin credential, only the DSRM password above) --
# kept only for any downstream role that wants a documented reference to
# the DA account. NOTE: the real Administrator (RID 500) password on this
# box is not actually known (whatever the box image ships with, not
# necessarily "vagrant") -- confirmed live that "vagrant" is a *separate*
# domain principal DCPromo carries over from the pre-existing local
# account, not a rename of Administrator itself. Do not assume this
# default is correct without verifying against the actual box.
charlie_domain_admin_user: Administrator
charlie_domain_admin_password: 'UNKNOWN-not-actually-vagrant'
