---
# charlie_domain -- runs on dc1.charlie. Promotes the charlie.local forest
# root DC. Mirrors alpha_domain's exact pattern (see that role for the
# reference implementation this was copied from). Single-host role (only
# ever wired to DC1_CHARLIE via role()), so no inventory_hostname dispatch
# is needed here -- that's only required for a role wired to multiple
# different instances in the same main.yml (see supply_chain_deploy).

- name: Promote dc1.charlie to the charlie.local forest root DC
  microsoft.ad.domain:
    dns_domain_name: '{{ charlie_dns_domain }}'
    domain_netbios_name: '{{ charlie_netbios }}'
    safe_mode_password: '{{ charlie_safe_mode_password }}'
    reboot: true
  register: charlie_promote

- name: Wait for the AD DS / DNS stack to settle after promotion
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    Get-ADDomain {{ charlie_dns_domain }} | Out-Null
    'DOMAIN-READY'
  register: charlie_ready
  retries: 30
  delay: 10
  until: "'DOMAIN-READY' in charlie_ready.stdout"
  changed_when: false

# asrep_bait_user/helpdesk_admin_user both place their domain users in this
# OU (a GOAD-themed name, kept as-is for fidelity to the original naming)
# rather than the default Users container -- a plain forest promotion
# doesn't create it, so both roles would otherwise fail with "Directory
# object not found" on their first New-ADUser call.
- name: Create the Crownlands OU (asrep_bait_user/helpdesk_admin_user's target)
  microsoft.ad.ou:
    name: Crownlands
    path: 'DC=charlie,DC=local'
    state: present

# Multi-homed DC hygiene: the DC registers BOTH NICs (segment + NAT mgmt)
# in AD DNS, so its host record resolves to two addresses and DC location
# on members gets a poisoned candidate list (membership-module crash, see
# domain_join). Purge non-segment A records and stop the mgmt NIC from
# re-registering (also sweeps members' mgmt registrations that predate
# this fix).
- name: Purge non-segment A records from the AD DNS zone
  ansible.windows.win_shell: |
    $zone = '{{ charlie_dns_domain }}'
    $prefix = '{{ charlie_segment_prefix }}'
    $bad = Get-DnsServerResourceRecord -ZoneName $zone -RRType A |
      Where-Object { $_.RecordData.IPv4Address -notlike "$prefix*" }
    if ($bad) {
      foreach ($r in $bad) {
        Remove-DnsServerResourceRecord -ZoneName $zone -RRType A -Name $r.HostName -RecordData $r.RecordData.IPv4Address -Force
      }
      'REMOVED'
    } else { 'NONE' }
  register: charlie_dns_purge
  changed_when: "'REMOVED' in charlie_dns_purge.stdout"

- name: Stop non-segment adapters from re-registering in AD DNS
  ansible.windows.win_shell: |
    $prefix = '{{ charlie_segment_prefix }}'
    $idx = Get-NetIPAddress -AddressFamily IPv4 |
      Where-Object { $_.IPAddress -notlike "$prefix*" -and $_.IPAddress -notlike '127.*' } |
      Select-Object -ExpandProperty InterfaceIndex -Unique
    if ($idx) { $idx | ForEach-Object { Set-DnsClient -InterfaceIndex $_ -RegisterThisConnectionsAddress $false }; 'UNREGISTERED' } else { 'NONE' }
  register: charlie_mgmt_unregister
  changed_when: "'UNREGISTERED' in charlie_mgmt_unregister.stdout"
