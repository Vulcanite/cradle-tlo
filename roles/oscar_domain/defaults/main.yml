---
# oscar_domain -- promote the oscar.local AD forest on dc1.oscar. Mirrors
# alpha_domain/charlie_domain's pattern exactly. sqli_webapp's dc_oscar_setup
# creates every M5 domain principal itself (svc_searchapp, delegator.svc,
# gpo.maintainer, laps.reader, sql_svc) -- this role only needs to stand up
# a plain working forest for that content to run against.

oscar_dns_domain: oscar.local
oscar_netbios: OSCAR

# First three octets of this domain's segment subnet (10.30.0.0/24); the
# post-promotion DNS cleanup purges zone A records outside this prefix.
oscar_segment_prefix: '10.30.'

# DSRM / safe-mode password for the DC promotion.
oscar_safe_mode_password: 'Dsrm-Oscar-2026!'

# Not referenced by this role's own tasks -- see charlie_domain's defaults
# for why this default is deliberately unverified/unused (the real
# Administrator RID-500 password is not actually known; "vagrant" is a
# separate domain principal, not Administrator itself).
oscar_domain_admin_user: Administrator
oscar_domain_admin_password: 'UNKNOWN-not-actually-vagrant'
